<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CircuitLab — [make Circuit]</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc; --panel: #ffffff; --panel2: #f1f5f9; --border: #e2e8f0; 
      --accent: #0284c7; --accent2: #10b981; --warn: #f43f5e; 
      --text: #1e293b; --muted: #64748b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif;
      height:100vh; display:flex; flex-direction:column; overflow:hidden;
    }

    /* 네비게이션 */
    nav{
      background:var(--panel); border-bottom:1px solid var(--border);
      padding:0 20px; height:56px; display:flex; align-items:center; flex-shrink:0;
      z-index:100; box-shadow:0 1px 2px rgba(0,0,0,0.05);
    }
    .logo-link { text-decoration: none; display: flex; align-items: center; }
    .logo{ font-family:'Space Mono',monospace; color:var(--accent); font-size:18px; font-weight:700; letter-spacing:2px; }
    .logo span{color:var(--accent2);}
    .nav-r{ margin-left:auto; display:flex; align-items:center; gap:12px; }
    
    .btn-ui {
      background:var(--panel2); border:1px solid var(--border); padding:8px 16px; 
      border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s;
      display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none;
    }
    .btn-ui:hover { border-color:var(--accent); color:var(--accent); background: #fff; }
    .btn-primary { background:var(--accent); color:#fff; border:none; }
    .btn-primary:hover { background:#0369a1; }

    /* 메인 영역 */
    .main { display:flex; flex:1; overflow:hidden; }
    .sidebar {
      width:540px; min-width:500px; max-width:640px;
      background:var(--panel); border-right:1px solid var(--border);
      display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; z-index:5;
    }
    .ss{padding:24px; border-bottom:1px solid var(--border);}
    .ss h3{ font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:12px; font-family:'Space Mono',monospace; font-weight: 700; }
    
    .problem-section{ flex: 0 0 auto; max-height: 35%; overflow-y: auto; }
    .code-section{ flex: 1; display:flex; flex-direction:column; min-height:0; }
    .hljs-wrap { flex: 1; overflow: auto; border-radius: 6px; border: 1px solid var(--border); background: #f8fafc; }
    code.hljs { font-family: 'Space Mono', monospace; font-size: 13px; padding: 20px; }

    .circuit-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .toolbar{
      padding:10px 20px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:12px; background:var(--panel); flex-shrink:0; z-index:5;
    }
    .wire-color{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;}
    .wire-color.sel{border-color:#333;transform:scale(1.2);}
    
    .canvas-wrap{flex:1;position:relative;background:var(--bg);cursor:crosshair;}
    canvas{display:block;position:absolute;top:0;left:0;}

    /* 오버레이 (정가운데 정렬 보강) */
    .overlay {
      position:fixed; inset:0; background:#f8fafc; z-index:300;
      display:flex; align-items:center; justify-content:center;
      padding:40px; overflow-y:auto;
    }
    .overlay-content { 
      max-width:1200px; width:100%; text-align:center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    
    .btn-home {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border-radius: 12px; border: 1px solid #e2e8f0;
      background: #eff6ff; color: #2563eb; text-decoration: none;
      font-size: 14px; font-weight: 700; transition: all 0.2s;
      margin-bottom: 24px; align-self: center; /* 확실한 중앙 배치 */
    }
    .btn-home:hover { 
      background: #2563eb; color: #fff; 
      border-color: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); 
      transform: translateY(-1px);
    }

    .stage-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; width: 100%; margin-top: 40px; }
    .stage-card {
      background: #fff; border: 1px solid var(--border); border-radius: 20px;
      padding: 32px 20px; cursor: pointer; transition: all 0.3s;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; min-height: 180px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .stage-card:hover { transform: translateY(-8px); border-color: var(--accent); }
    .stage-card .num { font-family: 'Space Mono', monospace; font-size: 32px; font-weight: 700; color: var(--accent); }

    .modal-ov{ position:fixed;inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(4px); }
    .modal-ov.show{display:flex;}
    .modal{ background:#fff; border-radius:24px; padding:40px; max-width:420px; width:90%; text-align:center; }
    .notif{ position:fixed; top:70px; right:20px; background:#fff; border:1px solid var(--accent2); border-radius:12px; padding:12px 18px; font-size:13px; display:none; z-index:500; color:#059669; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo-link">
      <div class="logo">⚡Circuit<span>Lab</span></div>
    </a>
    <div style="width:1px; height:22px; background:var(--border); margin:0 15px;"></div>
    <button id="listBtn" class="btn-ui">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      미션 목록
    </button>
    <div class="nav-r">
      <button class="btn-ui" id="resetBtn">⟳ 초기화</button>
      <button class="btn-ui btn-primary" id="submitBtn">✓ 채점 제출</button>
    </div>
  </nav>

  <div class="main">
    <div class="sidebar">
      <div class="ss problem-section">
        <h3>미션 정보</h3>
        <div id="probTitle" style="font-size:18px; font-weight:700;"></div>
        <div id="probDesc" style="font-size:13px; color:var(--muted); margin-top:8px;"></div>
      </div>
      <div class="ss code-section">
        <h3>소스 코드</h3>
        <div class="hljs-wrap">
          <pre><code id="codeEditor" class="language-cpp"></code></pre>
        </div>
      </div>
    </div>
    <div class="circuit-area">
      <div class="toolbar">
        <span style="font-size:12px; color:var(--muted); font-weight:700;">점퍼선 색:</span>
        <div class="wire-color sel" style="background:#ff4444" data-c="#ff4444"></div>
        <div class="wire-color" style="background:#4488ff" data-c="#4488ff"></div>
        <div class="wire-color" style="background:#44dd88" data-c="#44dd88"></div>
        <div class="wire-color" style="background:#ffcc00" data-c="#ffcc00"></div>
        <div style="margin-left:auto; display:flex; gap:10px; align-items:center;">
          <button class="btn-ui" id="zoomMinus" style="padding:4px 10px;">−</button>
          <span id="zoomLabel" style="font-size:12px; min-width:40px; text-align:center;">100%</span>
          <button class="btn-ui" id="zoomPlus" style="padding:4px 10px;">+</button>
        </div>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="c"></canvas>
      </div>
    </div>
  </div>

  <div class="modal-ov" id="modal">
    <div class="modal">
      <div id="mIcon" style="font-size:56px;"></div>
      <h2 id="mTitle" style="margin:10px 0;"></h2>
      <div id="mScore" style="font-weight:700; color:var(--accent);"></div>
      <p id="mMsg" style="color:var(--muted); margin:20px 0; line-height:1.6;"></p>
      <button id="modalClose" class="btn-ui btn-primary" style="padding:12px 40px;">확인</button>
    </div>
  </div>

  <div class="notif" id="notif"></div>

  <div class="overlay" id="stageOverlay">
    <div class="overlay-content">
      <a href="/" class="btn-home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        메인으로 돌아가기
      </a>
      <h1 style="margin-bottom:12px; font-size:32px;">🔌 미션 선택</h1>
      <p style="color:var(--muted); font-size:16px;">설계할 하드웨어 회로 미션을 선택하십시오.</p>
      <div class="stage-grid" id="stageGrid"></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
