<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CircuitLab — 아두이노 학습 플랫폼</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --accent: #0284c7;
      --accent2: #10b981;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 부드러운 배경 효과 */
    .bg-blob {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.05) 0%, rgba(2, 132, 199, 0) 70%);
      border-radius: 50%;
      z-index: -1;
      filter: blur(40px);
      animation: float 20s infinite alternate;
    }
    .blob-1 { top: -150px; left: -150px; }
    .blob-2 { bottom: -150px; right: -150px; animation-delay: -10s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 30px) scale(1.05); }
    }

    .container {
      text-align: center;
      max-width: 1000px;
      width: 90%;
      z-index: 10;
    }

    .logo {
      font-family: 'Space Mono', monospace;
      color: var(--accent);
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 8px;
      display: inline-block;
    }
    .logo span { color: var(--accent2); }

    .subtitle {
      color: var(--muted);
      margin-bottom: 60px;
      font-size: 18px;
      font-weight: 400;
    }

    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .mode-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 50px 40px;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    }

    .mode-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .icon {
      font-size: 60px;
      margin-bottom: 24px;
      transition: transform 0.3s ease;
    }
    .mode-card:hover .icon {
      transform: scale(1.1);
    }

    .mode-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
      font-family: 'Space Mono', monospace;
      color: var(--text);
    }

    .mode-desc {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.7;
      word-break: keep-all;
    }

    @media (max-width: 768px) {
      .modes { grid-template-columns: 1fr; }
      .logo { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="container">
    <div class="logo">⚡Circuit<span>Lab</span></div>
    <p class="subtitle">누구나 쉽게 시작하는 아두이노 회로 & 코딩 학습</p>
    
    <div class="modes">
      <a href="/make-code.html" class="mode-card">
        <div class="icon">💻</div>
        <div class="mode-title">[make Code]</div>
        <div class="mode-desc">
          완성된 회로를 보고<br>
          동작 원리에 맞는 아두이노 코드를 작성하세요.
        </div>
      </a>

      <a href="/make-circuit.html" class="mode-card">
        <div class="icon">🔌</div>
        <div class="mode-title">[make Circuit]</div>
        <div class="mode-desc">
          주어진 소스 코드를 분석하여<br>
          올바른 하드웨어 회로 연결을 설계하세요.
        </div>
      </a>
    </div>
  </div>
</body>
</html>
