<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CircuitLab — [make Code]</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  
  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>

  <!-- Blockly (로컬 서빙 — CDN 의존 제거로 흰 화면 방지) -->
  <script src="/blockly.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc; --panel: #ffffff; --panel2: #f1f5f9; --border: #e2e8f0; 
      --accent: #0284c7; --accent2: #10b981; --warn: #f43f5e; 
      --text: #1e293b; --muted: #64748b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif;
      height:100vh; display:flex; flex-direction:column; overflow:hidden;
    }

    /* 네비게이션 */
    nav{
      background:var(--panel); border-bottom:1px solid var(--border);
      padding:0 20px; height:56px; display:flex; align-items:center; flex-shrink:0;
      z-index:100; box-shadow:0 1px 2px rgba(0,0,0,0.05);
    }
    .logo-link { text-decoration: none; display: flex; align-items: center; }
    .logo{ font-family:'Space Mono',monospace; color:var(--accent); font-size:18px; font-weight:700; letter-spacing:2px; }
    .logo span{color:var(--accent2);}
    
    .nav-r{ margin-left:auto; display:flex; align-items:center; gap:12px; }
    
    /* 공통 버튼 스타일 */
    .btn-ui {
      background:var(--panel2); border:1px solid var(--border); padding:8px 16px; 
      border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s;
      display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none;
    }
    .btn-ui:hover { border-color:var(--accent); color:var(--accent); background: #fff; transform: translateY(-1px); }
    .btn-primary { background:var(--accent); color:#fff; border:none; }
    .btn-primary:hover { background:#0369a1; color: #fff; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2); }

    /* 메인 영역 */
    .main { display:flex; flex:1; overflow:hidden; }
    .sidebar {
      width:750px; min-width:600px; max-width:900px;
      background:var(--panel); border-right:1px solid var(--border);
      display:flex; flex-direction:column; flex-shrink:0;
    }
    .ss{ padding:24px; border-bottom:1px solid var(--border); }
    .ss h3{ font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:12px; font-family:'Space Mono',monospace; font-weight:700; }
    
    .code-section{ flex: 1; display:flex; flex-direction:column; min-height:0; padding:0 !important; }
    .code-header { padding:16px 24px; border-bottom:1px solid var(--border); background:var(--panel); }

    /* 에디터 영역 */
    #blocklyArea, #codeArea { flex:1; position:relative; min-height:0; display:none; flex-direction:column; }
    #blocklyDiv { position:absolute; inset:0; }
    .CodeMirror { flex:1; font-family:'Space Mono',monospace; font-size:14px; }

    .circuit-area{ flex:1; display:flex; flex-direction:column; background:var(--bg); }
    .canvas-wrap{ flex:1; position:relative; cursor:grab; }
    canvas{ display:block; position:absolute; top:0; left:0; }

    /* 오버레이 공통 */
    .overlay {
      position:fixed; inset:0; background:#f8fafc; z-index:300;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:40px; overflow-y:auto;
    }
    .overlay-content { max-width:1000px; width:100%; text-align:center; }
    .overlay-header { margin-bottom:40px; }
    .overlay-header h1 { font-size:36px; margin-bottom:12px; }
    .overlay-header p { color:var(--muted); font-size:18px; margin-bottom:30px; }

    /* 통일된 홈 버튼 스타일 (차별화된 색상) */
    .btn-home {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 24px; border-radius: 12px; border: 1px solid #e2e8f0;
      background: #eff6ff; color: #2563eb; text-decoration: none;
      font-size: 14px; font-weight: 700; transition: all 0.2s;
      margin-bottom: 24px;
    }
    .btn-home:hover { 
      background: #2563eb; color: #fff; 
      border-color: #2563eb; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); 
      transform: translateY(-1px);
    }
    .btn-home svg { transition: transform 0.2s; }
    .btn-home:hover svg { transform: scale(1.1); }

    .choice-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .choice-card {
      background:#fff; border:2px solid var(--border); border-radius:24px;
      padding:50px 30px; cursor:pointer; transition:all 0.3s;
      display:flex; flex-direction:column; align-items:center; gap:20px;
    }
    .choice-card:hover { border-color:var(--accent); transform:translateY(-8px); box-shadow:0 20px 25px -5px rgba(0,0,0,0.1); }
    
    .stage-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:24px; width:100%; max-width: 1200px; }
    .stage-card {
      background:#fff; border:1px solid var(--border); border-radius:20px;
      padding:32px 20px; cursor:pointer; text-align:center; transition: all 0.2s;
      min-height: 180px; display: flex; flex-direction: column; justify-content: center;
    }
    .stage-card:hover { border-color:var(--accent); transform:translateY(-5px); box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
    .stage-card .num { font-size:32px; font-weight:700; color:var(--accent); margin-bottom:10px; font-family: 'Space Mono', monospace; }

    .modal-ov { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(4px); }
    .modal-ov.show { display: flex; }
    .modal { background:#fff; border-radius:24px; padding:40px; max-width:450px; width:90%; text-align:center; }
    .notif { position:fixed; top:70px; right:20px; background:#fff; border:1px solid var(--accent2); padding:12px 20px; border-radius:12px; z-index:500; display:none; }
  </style>
</head>
<body>
  <!-- 1. 학습 방식 선택 -->
  <div class="overlay" id="choiceOverlay">
    <div class="overlay-content">
      <div class="overlay-header">
        <a href="/" class="btn-home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          메인으로 돌아가기
        </a>
        <h1>학습 방식 선택</h1>
        <p>어떤 방식으로 아두이노 코딩을 시작할까요?</p>
      </div>
      <div class="choice-grid">
        <div class="choice-card" id="chooseBlock">
          <div class="icon" style="font-size:60px;">🧩</div>
          <h2>블록코딩</h2>
          <p>마우스로 조립하며 즐겁게!<br>논리 구조를 쉽게 익힙니다.</p>
        </div>
        <div class="choice-card" id="chooseText">
          <div class="icon" style="font-size:60px;">✍️</div>
          <h2>텍스트 코딩</h2>
          <p>실제 아두이노 언어로!<br>텍스트 문법과 실전을 익힙니다.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 미션 선택 -->
  <div class="overlay" id="stageOverlay" style="display:none;">
    <div class="overlay-content">
      <div class="overlay-header">
        <a href="/" class="btn-home">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          메인으로 돌아가기
        </a>
        <h1>💻 미션 선택</h1>
        <p>도전할 아두이노 미션을 선택하세요.</p>
      </div>
      <div class="stage-grid" id="stageGrid"></div>
    </div>
  </div>

  <nav>
    <a href="/" class="logo-link">
      <div class="logo">⚡Circuit<span>Lab</span></div>
    </a>
    <div style="width:1px; height:20px; background:var(--border); margin:0 15px;"></div>
    <button id="listBtn" class="btn-ui">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      미션 목록
    </button>
    <div class="nav-r">
      <button class="btn-ui" id="resetBtn">⟳ 초기화</button>
      <button class="btn-ui btn-primary" id="submitBtn">✓ 채점 제출</button>
    </div>
  </nav>

  <div class="main">
    <div class="sidebar">
      <div class="ss problem-section" style="flex:0 0 auto; max-height:30%; overflow-y:auto;">
        <h3>미션 정보</h3>
        <div id="probTitle" style="font-size:18px; font-weight:700;"></div>
        <div id="probDesc" style="font-size:13px; color:var(--muted); margin-top:10px; line-height:1.6;"></div>
      </div>
      <div class="ss code-section">
        <div class="code-header">
          <h3 id="editorLabel">프로그래밍</h3>
        </div>
        <div id="blocklyArea">
          <div id="blocklyDiv"></div>
        </div>
        <div id="codeArea">
          <textarea id="codeEditor"></textarea>
        </div>
      </div>
    </div>
    <div class="circuit-area">
      <div style="padding:12px 24px; border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); background:#fff; display:flex; align-items:center; gap:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
        회로 구성 (참고용)
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="c"></canvas>
      </div>
    </div>
  </div>

  <div class="modal-ov" id="modal">
    <div class="modal">
      <div id="mIcon" style="font-size:56px;"></div>
      <h2 id="mTitle" style="margin:10px 0;"></h2>
      <div id="mScore" style="font-weight:700;"></div>
      <p id="mMsg" style="color:var(--muted); margin:20px 0; line-height:1.6;"></p>
      <button id="modalClose" class="btn-ui btn-primary" style="padding:12px 40px; font-size:15px;">확인</button>
    </div>
  </div>

  <div class="notif" id="notif"></div>

  <script type="module" src="/app-c2c.js"></script>
</body>
</html>
