<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CircuitLab — 아두이노 학습 플랫폼</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f8fafc;
      color: #1e293b;
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .hero {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .badge {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 4px;
      color: #0284c7;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.2s;
    }

    .logo {
      font-family: 'Space Mono', monospace;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 6px;
      line-height: 1;
      margin-bottom: 6px;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.4s;
    }
    .logo .c1 { color: #0284c7; }
    .logo .c2 { color: #10b981; }

    .tagline {
      font-size: 17px;
      color: #64748b;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 56px;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.6s;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 48px;
      background: linear-gradient(135deg, #0284c7, #10b981);
      color: #fff;
      text-decoration: none;
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      font-weight: 700;
      border-radius: 50px;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 0 40px rgba(2, 132, 199, 0.35);
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.8s;
      position: relative;
      overflow: hidden;
    }
    .cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #10b981, #0284c7);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .cta:hover::before { opacity: 1; }
    .cta:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.45);
    }
    .cta span { position: relative; z-index: 1; }
    .cta svg { position: relative; z-index: 1; transition: transform 0.3s; }
    .cta:hover svg { transform: translateX(4px); }

    .stats {
      display: flex;
      gap: 48px;
      margin-top: 56px;
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 1s;
    }
    .stat {
      text-align: center;
    }
    .stat-num {
      font-family: 'Space Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-num .accent { color: #0284c7; }
    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .stat-divider {
      width: 1px;
      background: #e2e8f0;
      align-self: stretch;
    }

    /* 코너 장식 */
    .corner {
      position: fixed;
      width: 60px;
      height: 60px;
      z-index: 6;
      opacity: 0.25;
    }
    .corner-tl { top: 24px; left: 24px; border-top: 2px solid #0284c7; border-left: 2px solid #0284c7; }
    .corner-tr { top: 24px; right: 24px; border-top: 2px solid #0284c7; border-right: 2px solid #0284c7; }
    .corner-bl { bottom: 24px; left: 24px; border-bottom: 2px solid #0284c7; border-left: 2px solid #0284c7; }
    .corner-br { bottom: 24px; right: 24px; border-bottom: 2px solid #0284c7; border-right: 2px solid #0284c7; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="hero">
    <div class="badge">⚡ Arduino Learning Platform</div>
    <div class="logo">
      <span class="c1">Circuit</span><span class="c2">Lab</span>
    </div>
    <p class="tagline">소스 코드를 분석하고, 올바른 회로를 직접 설계하세요.</p>
    <a href="/make-circuit.html" class="cta">
      <span>시작하기</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
    <div class="stats">
      <div class="stat">
        <div class="stat-num">9<span class="accent">+</span></div>
        <div class="stat-label">부품 종류</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-num"><span class="accent">AI</span></div>
        <div class="stat-label">GPT 채점</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="stat-num"><span class="accent">∞</span></div>
        <div class="stat-label">미션</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ── 부품 드로워들 ──────────────────────────────────────────
    function drawResistor(ctx, s) {
      const bw = 36 * s, bh = 12 * s;
      // 리드
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2 * s; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-26 * s, 0); ctx.lineTo(-bw / 2, 0); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(26 * s, 0);  ctx.lineTo(bw / 2, 0);  ctx.stroke();
      // 몸통
      ctx.fillStyle = '#d4a843'; ctx.strokeStyle = '#a07820'; ctx.lineWidth = 1.5 * s;
      ctx.beginPath();
      ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 4 * s);
      ctx.fill(); ctx.stroke();
      // 밴드
      const bands = ['#8B4513','#111','#e63900','#cccc00'];
      bands.forEach((c, i) => {
        const x = -bw / 2 + (i + 0.8) * (bw / (bands.length + 0.5));
        ctx.fillStyle = c;
        ctx.fillRect(x, -bh / 2 + 1 * s, 3 * s, bh - 2 * s);
      });
    }

    function drawLED(ctx, s) {
      const bh = 16 * s, bw = 14 * s, domeR = 8 * s;
      // 리드
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2 * s;
      ctx.beginPath(); ctx.moveTo(-5 * s, 0); ctx.lineTo(-5 * s, bh / 2 + 10 * s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5 * s, 0);  ctx.lineTo(5 * s,  bh / 2 + 10 * s); ctx.stroke();
      // 몸통
      ctx.fillStyle = '#cc2222'; ctx.strokeStyle = '#881111'; ctx.lineWidth = 1.5 * s;
      ctx.beginPath(); ctx.rect(-bw / 2, -bh / 2, bw, bh); ctx.fill(); ctx.stroke();
      // 돔
      ctx.beginPath(); ctx.arc(0, -bh / 2, domeR, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      // 광택
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(-3 * s, -bh / 2 - 2 * s, domeR * 0.4, 0, Math.PI * 2); ctx.fill();
    }

    function drawBuzzer(ctx, s) {
      const r = 18 * s;
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2 * s;
      ctx.beginPath(); ctx.moveTo(-7 * s, r); ctx.lineTo(-7 * s, r + 10 * s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(7 * s, r);  ctx.lineTo(7 * s,  r + 10 * s); ctx.stroke();
      ctx.fillStyle = '#1f2937'; ctx.strokeStyle = '#374151'; ctx.lineWidth = 2 * s;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(0, 0, 4 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ef4444'; ctx.font = `bold ${10 * s}px Space Mono`; ctx.textAlign = 'center';
      ctx.fillText('+', -7 * s, -2 * s);
    }

    function drawButton(ctx, s) {
      const bw = 30 * s, bh = 30 * s;
      ctx.fillStyle = '#b8b8b8'; ctx.strokeStyle = '#777'; ctx.lineWidth = 1.5 * s;
      ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 4 * s); ctx.fill(); ctx.stroke();
      [[-8*s,-8*s],[8*s,-8*s],[-8*s,8*s],[8*s,8*s]].forEach(([px,py]) => {
        ctx.fillStyle = '#555';
        ctx.beginPath(); ctx.arc(px, py, 4 * s, 0, Math.PI * 2); ctx.fill();
      });
      ctx.fillStyle = '#444';
      ctx.beginPath(); ctx.arc(0, 0, 10 * s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath(); ctx.arc(0, 0, 7 * s, 0, Math.PI * 2); ctx.fill();
    }

    function drawUltrasonic(ctx, s) {
      const bw = 52 * s, bh = 36 * s;
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2 * s;
      [-18*s,-6*s,6*s,18*s].forEach(x => {
        ctx.beginPath(); ctx.moveTo(x, bh / 2); ctx.lineTo(x, bh / 2 + 10 * s); ctx.stroke();
      });
      ctx.fillStyle = '#1a6b1a'; ctx.strokeStyle = '#145214'; ctx.lineWidth = 1.5 * s;
      ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 4 * s); ctx.fill(); ctx.stroke();
      [-12*s, 12*s].forEach(ex => {
        ctx.fillStyle = '#c0a000'; ctx.strokeStyle = '#8a7000'; ctx.lineWidth = 1 * s;
        ctx.beginPath(); ctx.arc(ex, 0, 9 * s, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(ex, 0, 6 * s, 0, Math.PI * 2); ctx.fill();
      });
    }

    function drawServo(ctx, s) {
      const bw = 52 * s, bh = 40 * s;
      ctx.strokeStyle = '#cc4400'; ctx.lineWidth = 2.5 * s;
      ctx.beginPath(); ctx.moveTo(-12*s, bh/2); ctx.lineTo(-12*s, bh/2+10*s); ctx.stroke();
      ctx.strokeStyle = '#ff2222';
      ctx.beginPath(); ctx.moveTo(0, bh/2); ctx.lineTo(0, bh/2+10*s); ctx.stroke();
      ctx.strokeStyle = '#663300';
      ctx.beginPath(); ctx.moveTo(12*s, bh/2); ctx.lineTo(12*s, bh/2+10*s); ctx.stroke();
      const g = ctx.createLinearGradient(-bw/2, 0, bw/2, 0);
      g.addColorStop(0, '#1a4fa0'); g.addColorStop(0.5, '#2266cc'); g.addColorStop(1, '#1a4fa0');
      ctx.fillStyle = g; ctx.strokeStyle = '#0d2d66'; ctx.lineWidth = 1.5 * s;
      ctx.beginPath(); ctx.roundRect(-bw/2, -bh/2, bw, bh, 4*s); ctx.fill(); ctx.stroke();
      // 기어
      ctx.fillStyle = '#1555bb'; ctx.strokeStyle = '#0d2d66'; ctx.lineWidth = 1*s;
      ctx.beginPath(); ctx.arc(0, -4*s, 12*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#aaa';
      ctx.beginPath(); ctx.arc(0, -4*s, 9*s, 0, Math.PI*2); ctx.fill();
      // 혼
      ctx.fillStyle = '#eee'; ctx.strokeStyle = '#aaa'; ctx.lineWidth = 1*s;
      ctx.beginPath(); ctx.roundRect(-3*s, -bh/2-14*s, 6*s, 16*s, 2*s); ctx.fill(); ctx.stroke();
    }

    function drawPotentiometer(ctx, s) {
      const bw = 30 * s, bh = 30 * s;
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2 * s;
      [-10*s,0,10*s].forEach(x => {
        ctx.beginPath(); ctx.moveTo(x, bh/2); ctx.lineTo(x, bh/2+10*s); ctx.stroke();
      });
      const g = ctx.createLinearGradient(-bw/2, 0, bw/2, 0);
      g.addColorStop(0,'#4a4a5a'); g.addColorStop(0.5,'#6a6a7e'); g.addColorStop(1,'#4a4a5a');
      ctx.fillStyle = g; ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5*s;
      ctx.beginPath(); ctx.roundRect(-bw/2, -bh/2, bw, bh, 5*s); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#888'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1*s;
      ctx.beginPath(); ctx.arc(0, 0, 10*s, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#b0b0b0';
      ctx.beginPath(); ctx.arc(0, 0, 7*s, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2*s; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(5*s,-5*s); ctx.stroke();
    }

    function drawPhotoresistor(ctx, s) {
      const r = 10 * s;
      ctx.strokeStyle = '#555'; ctx.lineWidth = 1.8 * s;
      ctx.beginPath(); ctx.moveTo(-8*s, r+2*s); ctx.lineTo(-8*s, r+12*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8*s, r+2*s);  ctx.lineTo(8*s,  r+12*s); ctx.stroke();
      ctx.fillStyle = '#fef3c7'; ctx.strokeStyle = '#d97706'; ctx.lineWidth = 1.5*s;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 1.5*s; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-6*s,-4*s); ctx.lineTo(-3*s,4*s); ctx.lineTo(0,-4*s); ctx.lineTo(3*s,4*s);
      ctx.stroke();
    }

    function drawSlideSwitch(ctx, s) {
      const bw = 34 * s, bh = 22 * s;
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2*s;
      [-10*s,0,10*s].forEach(x => {
        ctx.beginPath(); ctx.moveTo(x, bh/2); ctx.lineTo(x, bh/2+10*s); ctx.stroke();
      });
      ctx.fillStyle = '#2a2a3a'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5*s;
      ctx.beginPath(); ctx.roundRect(-bw/2, -bh/2, bw, bh, 4*s); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111'; ctx.strokeStyle = '#444'; ctx.lineWidth = 1*s;
      ctx.beginPath(); ctx.roundRect(-12*s, -4*s, 24*s, 8*s, 3*s); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ccc'; ctx.strokeStyle = '#999'; ctx.lineWidth = 1*s;
      ctx.beginPath(); ctx.roundRect(-16*s, -8*s, 10*s, 16*s, 3*s); ctx.fill(); ctx.stroke();
    }

    // ── 부품 파티클 ────────────────────────────────────────────
    const drawFns = [
      drawResistor, drawLED, drawBuzzer, drawButton,
      drawUltrasonic, drawServo, drawPotentiometer,
      drawPhotoresistor, drawSlideSwitch
    ];

    const COLORS = ['#0284c7','#10b981','#f59e0b','#8b5cf6','#ef4444','#06b6d4'];

    function randBetween(a, b) { return a + Math.random() * (b - a); }

    function makeParticle() {
      return {
        x:     randBetween(0, window.innerWidth),
        y:     randBetween(0, window.innerHeight),
        vx:    randBetween(-0.4, 0.4),
        vy:    randBetween(-0.4, 0.4),
        rot:   randBetween(0, Math.PI * 2),
        rotV:  randBetween(-0.008, 0.008),
        scale: randBetween(0.45, 0.85),
        alpha: randBetween(0.18, 0.40),
        draw:  drawFns[Math.floor(Math.random() * drawFns.length)],
      };
    }

    const PARTICLE_COUNT = 28;
    const particles = Array.from({ length: PARTICLE_COUNT }, makeParticle);

    // ── 연결선 파티클 ──────────────────────────────────────────
    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < 160) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(2,132,199,${0.10 * (1 - d / 160)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }
    }

    // ── 그리드 도트 배경 ───────────────────────────────────────
    function drawGrid() {
      const gs = 40;
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      for (let x = 0; x < canvas.width; x += gs) {
        for (let y = 0; y < canvas.height; y += gs) {
          ctx.beginPath();
          ctx.arc(x, y, 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // ── 메인 루프 ──────────────────────────────────────────────
    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 배경
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGrid();
      drawConnections();

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.rotV;

        const W = canvas.width, H = canvas.height;
        const margin = 120;
        if (p.x < -margin) p.x = W + margin;
        if (p.x > W + margin) p.x = -margin;
        if (p.y < -margin) p.y = H + margin;
        if (p.y > H + margin) p.y = -margin;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.alpha;
        p.draw(ctx, p.scale);
        ctx.restore();
      });

      ctx.globalAlpha = 1;
      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
