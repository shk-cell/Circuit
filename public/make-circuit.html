<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CircuitLab — [make Circuit]</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>

  <style>
    :root {
      --bg: #f8fafc; 
      --panel: #ffffff; 
      --panel2: #f1f5f9;
      --border: #e2e8f0; 
      --accent: #0284c7; 
      --accent2: #10b981;
      --warn: #f43f5e; 
      --text: #1e293b; 
      --muted: #64748b;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Noto Sans KR',sans-serif;
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    nav{
      background:var(--panel);
      border-bottom:1px solid var(--border);
      padding:0 20px;
      height:56px;
      display:flex;
      align-items:center;
      gap:16px;
      flex-shrink:0;
      box-shadow:0 1px 2px rgba(0,0,0,0.05);
      z-index:10;
    }
    .logo{
      font-family:'Space Mono',monospace;
      color:var(--accent);
      font-size:18px;
      font-weight:700;
      letter-spacing:2px;
    }
    .logo span{color:var(--accent2);}

    .prob-select { display: none; }

    /* 스테이지 선택 화면 스타일 (라이트 모드) */
    .stage-overlay {
      position: fixed; inset: 0;
      background: #f8fafc;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      overflow-y: auto;
      color: var(--text);
    }
    .stage-bg-blob {
      position: fixed; width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.05) 0%, rgba(2, 132, 199, 0) 70%);
      border-radius: 50%; z-index: -1; filter: blur(60px);
      animation: stageFloat 25s infinite alternate;
    }
    @keyframes stageFloat {
      0% { transform: translate(-10%, -10%) scale(1); }
      100% { transform: translate(10%, 10%) scale(1.1); }
    }
    .stage-header { text-align: center; margin-bottom: 50px; z-index: 10; }
    .stage-header h1 { font-size: 36px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
    .stage-header p { color: var(--muted); font-size: 18px; font-weight: 400; }
    .stage-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; max-width: 1100px; width: 100%; z-index: 10; }
    .stage-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    .stage-card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
    .stage-card .num { font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: var(--accent); }
    .stage-card .title { font-size: 15px; font-weight: 700; color: var(--text); word-break: keep-all; }
    .stage-home-btn {
      text-decoration:none; display:inline-flex; align-items:center; gap:8px; 
      background: var(--panel); padding:10px 20px; border-radius:12px; 
      color: var(--muted); font-size:14px; font-weight:700; border:1px solid var(--border); 
      transition:all 0.3s; margin-bottom: 30px;
    }
    .stage-home-btn:hover { color: var(--accent); border-color: var(--accent); background: #fff; }

    .nav-list-btn {
      text-decoration:none; display:flex; align-items:center; gap:6px; 
      background:var(--panel2); padding:8px 16px; border-radius:10px; 
      color:var(--text); font-size:13px; font-weight:700; border:1px solid var(--border); 
      transition:all 0.2s; cursor: pointer;
    }
    .nav-list-btn:hover { border-color: var(--accent); color: var(--accent); }

    .nav-r{ margin-left:auto; display:flex; align-items:center; gap:12px; }
    .submit-btn{
      background: var(--accent);
      color:#ffffff; border:none; padding:8px 20px; border-radius:10px;
      font-weight:700; cursor:pointer; font-size:13px;
    }
    .submit-btn:hover{ background: #0369a1; box-shadow:0 4px 12px rgba(2, 132, 199, 0.2); }
    .reset-btn{
      background:none; border:1px solid var(--border); color:var(--muted);
      padding:8px 16px; border-radius:10px; cursor:pointer; font-size:12px; transition:all 0.2s;
    }
    .reset-btn:hover{border-color:var(--warn);color:var(--warn); background: #fff5f5;}

    .main { display:flex; flex:1; overflow:hidden; }
    .sidebar {
      width:540px; min-width:500px; max-width:640px;
      background:var(--panel); border-right:1px solid var(--border);
      display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; z-index:5;
    }
    .ss{padding:24px; border-bottom:1px solid var(--border);}
    .ss h3{ font-size:11px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:12px; font-family:'Space Mono',monospace; font-weight: 700; }
    .prob-title{font-size:20px;font-weight:700;margin-bottom:12px;}
    .prob-desc{font-size:14px;color:var(--muted);line-height:1.8;}

    .sidebar-sections{ display:flex; flex-direction:column; flex: 1; min-height: 0; }
    .problem-section{ flex: 0 0 auto; max-height: 35%; overflow-y: auto; }
    .code-section{ flex: 1; display:flex; flex-direction:column; min-height:0; }
    
    .code-section .hljs-wrap { flex: 1; overflow: auto; border-radius: 6px; border: 1px solid var(--border); background: #f8fafc; }
    .code-section .hljs-wrap pre { margin: 0; height: 100%; }
    .code-section .hljs-wrap code.hljs { font-family: 'Space Mono', monospace; font-size: 13px; line-height: 1.7; display: block; padding: 20px; min-height: 100%; white-space: pre; }

    .circuit-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
    .toolbar{
      padding:10px 20px; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:12px; background:var(--panel); flex-shrink:0; flex-wrap:wrap; z-index:5;
    }
    .toolbar span{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;}
    .wire-color{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;}
    .wire-color.sel{border-color:#333;transform:scale(1.2);box-shadow:0 0 4px rgba(0,0,0,0.1);}
    .tb-sep{width:1px;height:24px;background:var(--border);margin:0 4px;}
    
    .zoom-btn{
      background:none; border:1px solid var(--border); color:var(--muted);
      width:32px; height:32px; border-radius:8px; cursor:pointer; 
      display:flex; align-items:center; justify-content:center; transition:all .2s;
    }
    .zoom-btn:hover{border-color:var(--accent);color:var(--accent); background: #fff;}
    .zoom-label{font-size:12px;color:var(--muted);font-family:'Space Mono',monospace;min-width:45px;text-align:center;}

    .canvas-wrap{flex:1;overflow:hidden;position:relative;background:var(--bg);cursor:crosshair;}
    .canvas-wrap.mode-pan{cursor:grab;}
    .canvas-wrap.mode-pan.dragging{cursor:grabbing;}
    canvas{display:block;position:absolute;top:0;left:0;}

    .modal-ov{ position:fixed;inset:0; background:rgba(0,0,0,.3); display:none; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(2px); }
    .modal-ov.show{display:flex;}
    .modal{ background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:40px; max-width:420px; width:90%; text-align:center; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1); }
    .notif{ position:fixed; top:70px; right:20px; background:var(--panel); border:1px solid var(--accent2); border-radius:12px; padding:12px 18px; font-size:13px; display:none; z-index:50; color:#059669; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .wire-sel-tip{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(244, 63, 94, 0.1); border:1px solid var(--warn); border-radius:8px; padding:10px 20px; font-size:13px; color:var(--warn); display:none; z-index:50; pointer-events:none; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">⚡Circuit<span>Lab</span></div>
    <div style="width:1px; height:22px; background:var(--border); margin:0 10px;"></div>
    <button id="listBtn" class="nav-list-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      미션 목록
    </button>
    <select id="probSelect" class="prob-select"></select>
    <div class="nav-r">
      <button class="reset-btn" id="resetBtn">⟳ 초기화</button>
      <button class="submit-btn" id="submitBtn">✓ 채점 제출</button>
    </div>
  </nav>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-sections">
        <div class="ss problem-section">
          <h3>미션 정보</h3>
          <div class="prob-title" id="probTitle"></div>
          <div class="prob-desc" id="probDesc"></div>
        </div>
        <div class="ss code-section">
          <h3>소스 코드</h3>
          <div class="hljs-wrap">
            <pre><code id="codeEditor" class="language-cpp"></code></pre>
          </div>
        </div>
      </div>
    </div>
    <div class="circuit-area">
      <div class="toolbar">
        <span>점퍼선 색:</span>
        <div class="wire-color sel" style="background:#ff4444" data-c="#ff4444"></div>
        <div class="wire-color" style="background:#4488ff" data-c="#4488ff"></div>
        <div class="wire-color" style="background:#44dd88" data-c="#44dd88"></div>
        <div class="wire-color" style="background:#ffcc00" data-c="#ffcc00"></div>
        <div class="wire-color" style="background:#ff8844" data-c="#ff8844"></div>
        <div class="wire-color" style="background:#cc44ff" data-c="#cc44ff"></div>
        <div class="wire-color" style="background:#aaaaaa" data-c="#aaaaaa"></div>
        <div class="wire-color" style="background:#111111;border-color:#ccc" data-c="#111111"></div>
        <div class="tb-sep"></div>
        <button class="zoom-btn" id="zoomMinus">−</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="zoom-btn" id="zoomPlus">+</button>
        <button class="zoom-btn" id="zoomReset" title="줌 초기화">⌂</button>
        <div class="tb-sep"></div>
        <span id="statusTxt" style="font-size:12px; color:var(--muted);">핀을 클릭해서 점퍼선 연결 시작</span>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="c"></canvas>
      </div>
    </div>
  </div>

  <div class="modal-ov" id="modal">
    <div class="modal">
      <div class="modal-icon" id="mIcon">🎉</div>
      <h2 id="mTitle">정답!</h2>
      <div class="modal-score" id="mScore">통과</div>
      <p id="mMsg"></p>
      <div class="modal-acts">
        <button class="mbtn mbtn-s" id="modalClose" style="padding:10px 24px; border-radius:10px; border:1px solid var(--border); background:var(--panel2); cursor:pointer; font-weight:700;">닫기</button>
      </div>
    </div>
  </div>

  <div class="notif" id="notif"></div>
  <div class="wire-sel-tip" id="wireTip">선택된 점퍼선 — Delete 키로 삭제 / 색상 버튼으로 변경</div>

  <div class="stage-overlay" id="stageOverlay">
    <div class="stage-bg-blob" style="top:-100px; left:-100px;"></div>
    <div class="stage-bg-blob" style="bottom:-100px; right:-100px; animation-delay:-10s;"></div>
    <div class="stage-header">
      <a href="/" class="stage-home-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        메인으로 돌아가기
      </a>
      <h1>🛠️ 미션 선택</h1>
      <p>설계할 하드웨어 회로 미션을 선택하십시오.</p>
    </div>
    <div class="stage-grid" id="stageGrid"></div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
